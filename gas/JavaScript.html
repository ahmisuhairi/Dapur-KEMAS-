  // Sistem Toast Pemberitahuan
  function showToast(message, type = 'info') {
    const container = document.getElementById('toast-container');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = `p-3.5 rounded-xl shadow-2xl text-xs font-bold pointer-events-auto flex items-center justify-between transition-all animate-fade-in border ${
      type === 'error'
        ? 'bg-rose-950/90 border-rose-500/50 text-rose-200 shadow-rose-950/50'
        : type === 'success'
        ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200 shadow-emerald-950/50'
        : 'bg-amber-950/90 border-amber-500/50 text-amber-200 shadow-amber-950/50'
    }`;

    toast.innerHTML = `
      <div class="flex items-center gap-2">
        <span>${type === 'error' ? '❌' : type === 'success' ? '✅' : 'ℹ️'}</span>
        <span>${escapeHtml(message)}</span>
      </div>
      <button onclick="this.parentElement.remove()" class="ml-3 text-zinc-400 hover:text-zinc-100 font-bold cursor-pointer">&times;</button>
    `;

    container.appendChild(toast);
    setTimeout(() => {
      if (toast.parentElement) toast.remove();
    }, 4500);
  }

  // Fungsi selamat untuk sembunyikan spinner & paparkan kandungan
  function hideSpinnerAndShowContent() {
    const spinner = document.getElementById('loading-spinner');
    const viewArea = document.getElementById('view-area');
    
    if (spinner) {
      spinner.style.setProperty('display', 'none', 'important');
      spinner.classList.add('hidden', 'is-hidden');
    }
    if (viewArea) {
      viewArea.style.removeProperty('display');
      viewArea.style.display = 'block';
      viewArea.classList.remove('hidden');
      viewArea.classList.add('is-visible');
    }
  }

  function showSpinner() {
    const spinner = document.getElementById('loading-spinner');
    const viewArea = document.getElementById('view-area');
    
    if (spinner) {
      spinner.style.removeProperty('display');
      spinner.style.display = 'flex';
      spinner.classList.remove('hidden', 'is-hidden');
    }
    if (viewArea) {
      viewArea.style.display = 'none';
      viewArea.classList.add('hidden');
      viewArea.classList.remove('is-visible');
    }
  }

  // Muat semakan data daripada pelayan Apps Script
  function refreshDataFromSheet() {
    showSpinner();
    appState.hasLoaded = false;

    if (requestTimeoutHandle) {
      clearTimeout(requestTimeoutHandle);
    }

    // Fail-Safe: Selepas 6 saat jika GAS tidak menjawab, buka data fallback secara automatik
    requestTimeoutHandle = setTimeout(() => {
      if (!appState.hasLoaded) {
        console.warn("Masa respon Google Apps Script melebihi 6 saat. Memuatkan data tempatan KEMAS Perlis...");
        forceLoadLocalData("Sambungan ke pelayan mengambil masa. Data paparan KEMAS Perlis sedia digunakan.");
      }
    }, 6000);

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(onDataLoaded)
        .withFailureHandler(onDataError)
        .apiGetAllData();
    } else {
      setTimeout(() => {
        forceLoadLocalData();
      }, 500);
    }
  }

  function onDataLoaded(res) {
    appState.hasLoaded = true;
    if (requestTimeoutHandle) clearTimeout(requestTimeoutHandle);

    hideSpinnerAndShowContent();

    if (!res || !res.success) {
      const errMsg = res && res.error ? res.error : "Gagal memuatkan data dari Google Sheet.";
      showToast(errMsg, 'error');
      applyDataToState(SAMPLE_KEMAS_DATA);
      renderCurrentTab();
      return;
    }

    if (!res.recipes || res.recipes.length === 0) {
      applyDataToState(SAMPLE_KEMAS_DATA);
      showToast("Pangkalan data baharu dikesan. Memaparkan data permulaan KEMAS Perlis.", 'info');
    } else {
      applyDataToState(res);
      showToast("Pangkalan data Google Sheet berjaya disegerakkan!", 'success');
    }

    if (res.note) {
      showToast(res.note, 'info');
    }

    renderCurrentTab();
  }

  function onDataError(err) {
    appState.hasLoaded = true;
    if (requestTimeoutHandle) clearTimeout(requestTimeoutHandle);

    hideSpinnerAndShowContent();

    const msg = err && err.message ? err.message : String(err);
    showToast("Ralat Sambungan GAS: " + msg, 'error');

    applyDataToState(SAMPLE_KEMAS_DATA);
    renderCurrentTab();
  }

  function applyDataToState(data) {
    appState.recipes = data.recipes || [];
    appState.bahanList = data.bahanList || [];
    appState.langkahList = data.langkahList || [];
    appState.users = data.users || [];
    if (data.masterData) appState.masterData = data.masterData;
  }

  function forceLoadLocalData(customMsg) {
    appState.hasLoaded = true;
    if (requestTimeoutHandle) clearTimeout(requestTimeoutHandle);

    hideSpinnerAndShowContent();
    applyDataToState(SAMPLE_KEMAS_DATA);
    renderCurrentTab();

    const statusText = document.getElementById('status-text');
    if (statusText) statusText.textContent = "Data KEMAS Aktif";

    showToast(customMsg || "Data Dapur KEMAS Perlis berjaya dimuatkan!", 'info');
  }

  function switchTab(tabName) {
    appState.currentTab = tabName;
    appState.selectedRecipe = null;

    ['dashboard', 'recipes', 'add', 'settings'].forEach(t => {
      const btn = document.getElementById('nav-' + t);
      if (btn) {
        if (t === tabName) {
          btn.className = "flex flex-col items-center py-1 px-3 text-amber-400 font-bold transition-colors cursor-pointer";
        } else {
          btn.className = "flex flex-col items-center py-1 px-3 text-zinc-400 hover:text-amber-400 font-medium transition-colors cursor-pointer";
        }
      }
    });

    renderCurrentTab();
  }

  function getSmartRecipeImage(r) {
    if (!r) return 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&q=80&w=800';
    if (r.Gambar_Utama && !r.Gambar_Utama.includes('photo-1546069901-ba9599a7e63c')) {
      return r.Gambar_Utama;
    }
    const name = (r.Nama_Resepi || '').toLowerCase();
    if (name.includes('rendang')) return 'https://images.unsplash.com/photo-1541832676-9b763b0239ab?auto=format&fit=crop&q=80&w=800';
    if (name.includes('laksa')) return 'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&q=80&w=800';
    if (name.includes('bakar') || name.includes('ikan')) return 'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?auto=format&fit=crop&q=80&w=800';
    if (name.includes('pulut') || name.includes('mempelam') || name.includes('panggang')) return 'https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&q=80&w=800';
    if (name.includes('kuih') || name.includes('seri muka')) return 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&q=80&w=800';
    if (name.includes('gulai') || name.includes('kawah') || name.includes('daging')) return 'https://images.unsplash.com/photo-1546833999-b9f581a1996d?auto=format&fit=crop&q=80&w=800';
    return 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&q=80&w=800';
  }

  function handleSaveRecipeSubmit(e) {
    e.preventDefault();
    const nama = document.getElementById('form-nama').value;
    const kategori = document.getElementById('form-kategori').value;
    const masa = document.getElementById('form-masa').value;
    const deskripsi = document.getElementById('form-deskripsi').value;

    const payload = {
      ID_Resepi: 'RSP-' + Date.now(),
      Nama_Resepi: nama,
      Kategori_Masakan: kategori,
      Masa_Memasak_Minit: Number(masa) || 30,
      Deskripsi: deskripsi,
      Status: 'Draf'
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      showToast("Menyimpan resepi ke Google Sheet...", "info");
      google.script.run
        .withSuccessHandler((res) => {
          showToast(res.message || "Resepi berjaya disimpan!", 'success');
          refreshDataFromSheet();
          switchTab('recipes');
        })
        .withFailureHandler((err) => {
          showToast("Ralat menyimpan: " + err, 'error');
        })
        .apiSaveRecipe(payload, [], []);
    } else {
      appState.recipes.unshift(payload);
      showToast("Resepi '" + nama + "' disimpan ke senarai tempatan!", 'success');
      switchTab('recipes');
    }
  }

  function approveDraftRecipe(recipeId) {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      showToast("Meluluskan resepi...", "info");
      google.script.run
        .withSuccessHandler((res) => {
          showToast(res.message || "Resepi diluluskan & diterbitkan!", 'success');
          refreshDataFromSheet();
        })
        .withFailureHandler((err) => {
          showToast("Ralat kelulusan: " + err, 'error');
        })
        .apiApproveRecipe(recipeId);
    } else {
      const r = appState.recipes.find(x => x.ID_Resepi === recipeId);
      if (r) r.Status = 'Diterbitkan';
      showToast("Resepi " + recipeId + " diluluskan!", 'success');
      renderCurrentTab();
    }
  }

  function triggerGASSetup() {
    showToast("Menjalankan setup database...", "info");
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((res) => {
          showToast(res.message || "Pangkalan data disiapkan!", 'success');
          refreshDataFromSheet();
        })
        .withFailureHandler((err) => {
          showToast("Ralat setup: " + err, 'error');
        })
        .setupDatabaseSheets();
    } else {
      showToast("Pemasangan simulasi diselesaikan!", 'info');
      refreshDataFromSheet();
    }
  }

  // Pembantu Sanitasi String
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeJsString(str) {
    if (!str) return '';
    return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
  }

  function closePdfCookbookModal() {
    const el = document.getElementById('pdf-cookbook-modal');
    if (el) el.remove();
  }

  function scrollPdfSection(pageNumber) {
    const target = document.getElementById(pageNumber === 1 ? 'gas-pdf-page-1' : 'gas-pdf-page-2');
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  // Muat Turun Fail PDF 2 Halaman (Menggunakan html2canvas dan jsPDF)
  async function downloadTwoPagePdf(recipeId) {
    const btn = document.getElementById('gas-btn-download-pdf');
    const page1 = document.getElementById('gas-pdf-page-1');
    const page2 = document.getElementById('gas-pdf-page-2');

    if (!page1 || !page2) {
      showToast("Elemen dokumen PDF tidak dijumpai.", "error");
      return;
    }

    if (typeof window.jspdf === 'undefined' || typeof html2canvas === 'undefined') {
      showToast("Pustaka PDF sedang dimuatkan, sila tunggu sebentar...", "info");
      return;
    }

    const originalBtnHtml = btn.innerHTML;
    btn.innerHTML = `
      <span class="animate-spin inline-block">⏳</span>
      <span>Menjana 2 Halaman...</span>
    `;
    btn.classList.add('opacity-80', 'cursor-wait');

    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4',
        compress: true
      });

      const pdfWidth = pdf.internal.pageSize.getWidth(); // 210mm
      const pdfHeight = pdf.internal.pageSize.getHeight(); // 297mm

      const canvasOptions = {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        logging: false,
        backgroundColor: '#ffffff'
      };

      // Tangkap Halaman 1 (Seksyen 1)
      const canvas1 = await html2canvas(page1, canvasOptions);
      const imgData1 = canvas1.toDataURL('image/jpeg', 0.95);
      const ratio1 = Math.min(pdfWidth / canvas1.width, pdfHeight / canvas1.height);
      const renderW1 = canvas1.width * ratio1;
      const renderH1 = canvas1.height * ratio1;
      const posX1 = (pdfWidth - renderW1) / 2;

      pdf.addImage(imgData1, 'JPEG', posX1, 0, renderW1, renderH1);

      // Tambah Halaman 2 (Seksyen 2)
      pdf.addPage();
      const canvas2 = await html2canvas(page2, canvasOptions);
      const imgData2 = canvas2.toDataURL('image/jpeg', 0.95);
      const ratio2 = Math.min(pdfWidth / canvas2.width, pdfHeight / canvas2.height);
      const renderW2 = canvas2.width * ratio2;
      const renderH2 = canvas2.height * ratio2;
      const posX2 = (pdfWidth - renderW2) / 2;

      pdf.addImage(imgData2, 'JPEG', posX2, 0, renderW2, renderH2);

      const r = appState.recipes.find(item => item.ID_Resepi === recipeId);
      const safeName = r && r.Nama_Resepi ? r.Nama_Resepi.replace(/[^a-zA-Z0-9\s_-]/g, '').trim().replace(/\s+/g, '_') : 'Resepi';
      const filename = `Cookbook_${safeName}_2Page.pdf`;

      pdf.save(filename);

      btn.innerHTML = `
        <span>✅</span>
        <span>PDF Berjaya Dimuat Turun!</span>
      `;
      btn.className = "font-bold px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm flex items-center gap-2 transition-all shadow-md bg-emerald-600 text-white cursor-pointer";

      showToast("PDF 2 Halaman berjaya dimuat turun ke peranti!", "success");

      setTimeout(() => {
        if (btn) {
          btn.innerHTML = originalBtnHtml;
          btn.className = "font-bold px-3.5 sm:px-4 py-2 rounded-xl text-xs sm:text-sm flex items-center gap-2 transition-all shadow-md bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/30 cursor-pointer active:scale-95";
          btn.classList.remove('opacity-80', 'cursor-wait');
        }
      }, 4000);

    } catch (err) {
      console.error("Ralat penjanaan PDF:", err);
      showToast("Ralat menjana PDF: " + (err.message || err), "error");
      btn.innerHTML = originalBtnHtml;
      btn.classList.remove('opacity-80', 'cursor-wait');
    }
  }
</script>
